<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inserat">
<meta name="theme-color" content="#0b5fff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Inserat-Scanner</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#10131a;--mut:#667085;--pri:#0b5fff;--ok:#12803c;--err:#c0262d;--bd:#d9dee8}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#181c24;--tx:#eef1f6;--mut:#98a1b3;--bd:#2a303c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;display:grid;gap:14px}
h1{font-size:22px;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;display:grid;gap:10px}
label{font-size:14px;color:var(--mut)}
input,textarea,select{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--bd);border-radius:12px;padding:12px}
textarea{min-height:76px;resize:vertical}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:15px;background:var(--pri);color:#fff;width:100%}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button:disabled{opacity:.5}
#reader{border-radius:12px;overflow:hidden}
#reader:empty{display:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
#msg{padding:12px;border-radius:12px;display:none}
#msg.ok{display:block;background:#e3f6ea;color:var(--ok)}
#msg.err{display:block;background:#fde7e8;color:var(--err)}
details summary{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Inserat-Scanner <small style="font-size:12px;color:var(--mut);font-weight:400">v4</small></h1>

  <div class="card">
    <button id="scanBtn">📷 Barcode scannen</button>
    <button id="scanPhotoBtn" class="sec" type="button">📸 Barcode per Foto lesen</button>
    <input id="scanPhotoIn" type="file" accept="image/*" capture="environment" hidden>
    <div id="reader"></div><div id="reader2" style="display:none"></div>
    <label for="ean">EAN / Artikelname</label>
    <input id="ean" inputmode="numeric" placeholder="EAN oder kurzer Name, z. B. Bosch Akkuschrauber">
  </div>

  <div class="card">
    <button id="photoBtn" class="sec">📸 Foto hinzufügen</button>
    <input id="photoIn" type="file" accept="image/*" capture="environment" hidden>
    <input id="galleryIn" type="file" accept="image/*" multiple hidden>
    <div class="thumbs" id="thumbs"></div>
    <button id="galBtn" class="sec" style="padding:10px;font-weight:500">Aus Galerie wählen</button>
  </div>

  <div class="card">
    <label for="zustand">Zustand</label>
    <select id="zustand">
      <option>Neu / originalverpackt</option>
      <option>Neuwertig</option>
      <option selected>Gut</option>
      <option>Gebraucht, Gebrauchsspuren</option>
      <option>Defekt / Bastler</option>
    </select>
    <label for="notiz">Zubehör, Mängel, Besonderheiten</label>
    <textarea id="notiz" placeholder="z. B. mit OVP, 2 Akkus, kleiner Kratzer links"></textarea>
    <div class="row">
      <div><label for="wunsch">Wunschpreis € (optional)</label><input id="wunsch" inputmode="decimal"></div>
      <div><label for="vers">Versand</label><select id="vers"><option>Versand + Abholung</option><option>Nur Abholung</option></select></div>
    </div>
  </div>

  <button id="send">An Claude senden</button>
  <div id="msg"></div>

  <details class="card" id="set">
    <summary>Einrichtung (einmalig)</summary>
    <a href="https://github.com/settings/personal-access-tokens/new?name=Inserat-Scanner&description=Inserat-Scanner%20Handy&target_name=harahaug&expires_in=365&contents=write&issues=write" target="_blank" rel="noopener" style="text-decoration:none"><button type="button">1. Token erstellen (GitHub öffnet sich)</button></a>
    <p style="margin:0;font-size:14px;color:var(--mut)">Dort: bei „Repository access" <b>Only select repositories</b> → <b>inserat-queue</b> wählen, ganz unten <b>Generate token</b>, dann auf das Kopier-Symbol neben dem Token tippen.</p>
    <button id="paste" type="button">2. Token aus Zwischenablage einfügen</button>
    <input id="repo" type="hidden"><input id="tok" type="hidden">
  </details>
</main>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{return localStorage.getItem(k)||''}catch(e){return ''} },
  set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
};
const photos = []; // {name, b64, url}

$('repo').value = store.get('repo') || 'harahaug/inserat-queue';
$('tok').value = store.get('tok');
$('paste').onclick = async () => {
  try{
    const t=(await navigator.clipboard.readText()).trim();
    if(!/^github_pat_[A-Za-z0-9_]+$/.test(t)){ show('In der Zwischenablage ist kein Token. Erst Schritt 1 und Kopieren.','err'); return; }
    store.set('tok',t); store.set('repo','harahaug/inserat-queue'); $('tok').value=t; $('set').open=false;
    show('Token gespeichert ✓ – du kannst senden.','ok');
  }catch(e){ show('Einfügen nicht erlaubt – bitte „Einfügen" bestätigen.','err'); }
};

function show(t,c){ const m=$('msg'); m.textContent=t; m.className=c; }

// --- Barcode scan ---
let scanner=null;
$('scanBtn').onclick = async () => {
  if(scanner){ await stopScan(); return; }
  if(typeof Html5Qrcode==='undefined'){ show('Scanner nicht geladen – EAN bitte tippen.','err'); return; }
  scanner = new Html5Qrcode('reader', { formatsToSupport:[
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128 ]});
  $('scanBtn').textContent='⏹ Scan stoppen';
  try{
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140}},
      async txt => { $('ean').value = txt; if(navigator.vibrate) navigator.vibrate(60); await stopScan(); show('Code erkannt: '+txt,'ok'); });
  }catch(e){ show('Live-Kamera blockiert ('+((e&&e.name)||e)+'). Nimm Barcode per Foto lesen.','err'); await stopScan(); }
};
async function stopScan(){
  try{ if(scanner){ await scanner.stop(); scanner.clear(); } }catch(e){}
  scanner=null; $('scanBtn').textContent='📷 Barcode scannen';
}

// --- Barcode per Foto (Fallback) ---
$('scanPhotoBtn').onclick = () => $('scanPhotoIn').click();
$('scanPhotoIn').onchange = async e => {
  const f=e.target.files[0]; if(!f) return;
  show('Lese Barcode ...','ok');
  try{
    const sc=new Html5Qrcode('reader2');
    const r=await sc.scanFile(f,false);
    $('ean').value=r; show('Code erkannt: '+r,'ok');
    const b64=await shrink(f); photos.push({b64,url:'data:image/jpeg;base64,'+b64}); renderThumbs();
  }catch(err){ show('Kein Barcode erkannt - naeher ran, scharf, gerade halten. Oder EAN tippen.','err'); }
  e.target.value='';
};

// --- Photos ---
$('photoBtn').onclick = () => $('photoIn').click();
$('galBtn').onclick = () => $('galleryIn').click();
$('photoIn').onchange = e => addFiles(e.target.files);
$('galleryIn').onchange = e => addFiles(e.target.files);

async function addFiles(files){
  for(const f of files){
    const b64 = await shrink(f);
    photos.push({ b64, url:'data:image/jpeg;base64,'+b64 });
  }
  renderThumbs();
}
function renderThumbs(){
  $('thumbs').innerHTML='';
  photos.forEach((p,i)=>{ const im=new Image(); im.src=p.url; im.onclick=()=>{photos.splice(i,1);renderThumbs();}; $('thumbs').append(im); });
}
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,1600/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=img.width*s; c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg',.85).split(',')[1]);
    };
    img.onerror=rej; img.src=u;
  });
}

// --- Send to GitHub ---
async function gh(path, opt={}){
  const repo=store.get('repo')||$('repo').value.trim()||'harahaug/inserat-queue', tok=store.get('tok')||$('tok').value.trim();
  if(!repo||!tok) throw new Error('Token fehlt: unten bei Einstellungen eintragen und auf Speichern tippen.');
  const r = await fetch('https://api.github.com/repos/'+repo+path, { ...opt,
    headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json', 'Content-Type':'application/json' }});
  if(!r.ok) throw new Error('GitHub '+r.status+': '+(await r.text()).slice(0,160));
  return r.json();
}
$('send').onclick = async () => {
  const ean=$('ean').value.trim();
  if(!ean && !photos.length){ show('Bitte EAN/Name oder Foto angeben.','err'); return; }
  $('send').disabled=true; show('Sende …','ok');
  try{
    const id = new Date().toISOString().replace(/[-:T]/g,'').slice(0,14);
    const files=[];
    for(let i=0;i<photos.length;i++){
      const p=`items/${id}/foto${i+1}.jpg`;
      await gh('/contents/'+p,{method:'PUT',body:JSON.stringify({message:'Foto '+id,content:photos[i].b64})});
      files.push(p);
    }
    const body = [
      '**EAN/Name:** '+(ean||'–'),
      '**Zustand:** '+$('zustand').value,
      '**Zubehör/Mängel:** '+($('notiz').value.trim()||'–'),
      '**Wunschpreis:** '+($('wunsch').value.trim()||'–'),
      '**Versand:** '+$('vers').value,
      '**Fotos:** '+(files.join(', ')||'–'),
      '', '<!-- id:'+id+' -->'
    ].join('\n');
    const title = 'Artikel '+id+(ean?' – '+ean.slice(0,60):'');
    const issue = await gh('/issues',{method:'POST',body:JSON.stringify({title,body,labels:['neu']})});
    show('Gesendet ✓ (Issue #'+issue.number+'). Freigabe per Kommentar in der GitHub-App.','ok');
    photos.length=0; renderThumbs(); $('ean').value=''; $('notiz').value=''; $('wunsch').value='';
  }catch(e){ show(String(e.message||e),'err'); }
  $('send').disabled=false;
};

if(!store.get('tok')) $('set').open=true;
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
